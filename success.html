<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request Received | Mobile Auto Detailing</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101114">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .simple { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px 16px;
      background: radial-gradient(70% 60% at 50% 100%, #12235a 0%, #0b0f1f 45%, #0b0c0f 80%); }
    .simple__inner { display: grid; justify-items: center; gap: 20px; max-width: 560px; }
    .simple h1 { font-family: var(--font-display); font-stretch: 112%; text-transform: uppercase; font-weight: 900; font-size: clamp(2.2rem, 8vw, 4rem); line-height: .95; }
    .simple p { color: var(--muted); }
    .simple img { width: min(560px, 100%); margin-top: 10px; }
  </style>
</head>
<body>
  <main class="simple">
    <div class="simple__inner">
      <p class="eyebrow">Thank you</p>
      <h1>Request <span class="accent">received.</span></h1>
      <p>Your appointment request was sent. This is not yet a confirmed booking — we'll contact you shortly to confirm availability. Need help sooner? Call <a href="tel:+10000000000" style="color:#5189ff">000-000-0000</a>.</p>
      <a class="btn btn--primary" href="/">Back to Home</a>
      <img src="/assets/img/hero-car.svg" width="1200" height="440" alt="">
    </div>
  </main>
</body>
</html>
